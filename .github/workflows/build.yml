name: build-and-push-base

# Baut das husky-offboard-base-Image und pusht es nach GHCR, sodass die beiden
# finalen Images (husky-offboard, husky-offboard-lite) es per
#   FROM ghcr.io/clairlab-haw/husky-offboard-base:jazzy
# cachen koennen (ein Base-Build, ueberall reused). Gelaedert bei Push auf main
# und bei manuellem Trigger.
#
# Multi-arch (amd64 + arm64): Mac/Apple-Silicon pullt arm64 nativ, der Husky-
# Roboter (x86_64) pullt amd64. arm64 laeuft hier via QEMU-Emulation (langsamer,
# aber die Base baut selten -> akzeptabel).

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/clairlab-haw/husky-offboard-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (fuer linux/arm64 via Emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (rolling + date-sha tag)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=jazzy
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Layer-Cache im Registry -> CI-Neubuilds reuse die Langsam-Layer
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max