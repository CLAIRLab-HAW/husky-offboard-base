name: build-and-push-base

# Builds the husky-offboard-base image and pushes it to GHCR so that every final image can cache it via
#   FROM ghcr.io/clairlab-haw/husky-offboard-base:jazzy
# (one base build, reused everywhere). Triggered on push to main and manually.
#
# Multi-arch (amd64 + arm64) is not a nicety here: the Mac pulls arm64 natively and the Husky robot (x86_64) pulls
# amd64 for the `lite` stage that runs ON it. arm64 is built under QEMU emulation -- slower, but the base builds
# rarely.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/clairlab-haw/husky-offboard-base

jobs:
  # The gate in front of the push. Until 2026-08-26 there was none: this repo published an image on every push to
  # main while the tests that check its three scripts sat in husky-offboard, which had no workflow at all.
  #
  # The floor -- `bash -n` on the scripts -- always runs. The behavioural checks live in the neighbouring repo by
  # design (they compare a script against the Dockerfiles that copy it), so they run when that repo can be checked
  # out and are reported as unavailable when it cannot; they never turn a token problem into a failed build.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: deploy/husky-offboard-base

      - name: Syntax-check the shell helpers
        working-directory: deploy/husky-offboard-base
        run: |
          set -euo pipefail
          for f in scripts/*; do
              echo "bash -n $f"
              bash -n "$f"
          done

      # tests/siblings.py in husky-offboard looks for this repo at deploy/husky-offboard-base -- the layout below
      # is what makes the cross-repo checks find it.
      - name: Check out husky-offboard beside it
        id: sibling
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: CLAIRLab-HAW/husky-offboard
          path: deploy/husky-offboard

      - uses: actions/setup-python@v5
        if: steps.sibling.outcome == 'success'
        with:
          python-version: "3.11"

      - name: Install the test dependencies
        if: steps.sibling.outcome == 'success'
        run: pip install pytest pyyaml

      - name: Run the neighbouring suite against this working tree
        if: steps.sibling.outcome == 'success'
        working-directory: deploy/husky-offboard
        run: >
          python -m pytest tests -q
          -m 'not offboard_e2e'
          -o 'markers=offboard_e2e: needs built images and a running docker'

      - name: Say so when the neighbour was unreachable
        if: steps.sibling.outcome != 'success'
        run: |
          echo "::warning::husky-offboard could not be checked out; only the shell syntax check gated this build."
          echo "If the repo is private, give this workflow a PAT with read access instead of GITHUB_TOKEN."

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (for linux/arm64 via emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (rolling + date-sha tag)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=jazzy
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Registry layer cache -> a CI rebuild reuses the slow layers
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max