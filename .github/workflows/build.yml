name: build-and-push-base

# Builds the husky-offboard-base image and pushes it to GHCR so that every final image can cache it via
#   FROM ghcr.io/clairlab-haw/husky-offboard-base:jazzy
# (one base build, reused everywhere). Triggered on push to main and manually.
#
# Multi-arch (amd64 + arm64) is not a nicety here: the Mac pulls arm64 natively and the Husky robot (x86_64) pulls
# amd64 for the `lite` stage that runs ON it. arm64 is built under QEMU emulation -- slower, but the base builds
# rarely.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/clairlab-haw/husky-offboard-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (for linux/arm64 via emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (rolling + date-sha tag)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=jazzy
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Registry layer cache -> a CI rebuild reuses the slow layers
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max